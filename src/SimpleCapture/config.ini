# CircularPiCam konfigurace
# Každý trigger lze nezávisle vypnout nastavením na false

fps = 60
pre_seconds = 2
post_seconds = 2
resolution_width = 1456
resolution_height = 1088
ramdisk_base = /mnt/ramdisk/CAM/frames
sync_enabled = false
rsync_dest = mill.lan:/storage/CAM/

# Po úspěšném uložení triggeru "dotknout" sentinel soubor, který hlídá
# systemd .path unit (musalacam-s3sync.path) a spustí upload službu
# (rclone -> S3). Služba je oneshot a systemd ji nikdy nespustí dvakrát souběžně.
upload_service_enabled = false
upload_trigger_file = /run/musalacam/upload-trigger
snapshot_interval_sec = 30

# Keyboard trigger (Enter)
trigger_keyboard = true

# GPIO trigger - nastav trigger_gpio_line na správný pin
trigger_gpio = false
trigger_gpio_chip = gpiochip0
trigger_gpio_line = 17

# Brightness trigger - náhlé navýšení jasu (např. meteor, blesk)
trigger_brightness = true
trigger_brightness_threshold = 1.5
trigger_brightness_debounce_sec = 5

# WebSocket trigger ({"type": "TRIGG"})
trigger_websocket = false
websocket_host = mill.lan
websocket_port = 8080
websocket_path = /trigger

# Parametry kamery
exposure_time_us = 5000
analogue_gain = 22.0

# Ukládat TIFF jako 8bit (menší soubory) místo 16bit
save_as_8bit = false
